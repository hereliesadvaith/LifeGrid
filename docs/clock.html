<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lifegrid Clock · Nothing widget mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Doto:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --bg: #000000;
    --surface: #0c0c0c;
    --ink: #ffffff;
    --mid: #9a9a9a;
    --dim: #5e5e5e;
    --line: #262626;
    --accent: #d71921;
    --dot: 1px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 25% 12%, #161616 0%, #050505 62%) fixed;
    color: var(--ink);
    font-family: "Space Mono", ui-monospace, monospace;
    display: grid;
    place-items: center;
    -webkit-font-smoothing: antialiased;
  }

  .stage { display: grid; gap: 22px; justify-items: center; padding: 40px 20px; }

  .meta {
    color: var(--dim);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .meta b { color: var(--ink); font-weight: 700; }

  /* ---- the widget: square Nothing-style card ---- */
  .widget {
    width: 320px;
    height: 320px;
    padding: 24px;
    border-radius: 24px;
    background: var(--surface);
    border: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: flex-start;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    /* dotted registration grid */
    background-image:
      radial-gradient(rgba(255,255,255,0.05) var(--dot), transparent var(--dot));
    background-size: 8px 8px;
  }
  /* corner registration marks */
  .widget::before,
  .widget::after {
    content: "";
    position: absolute;
    width: 11px; height: 11px;
    border: 1px solid var(--dim);
    opacity: 0.4;
  }
  .widget::before { top: 12px; left: 12px; border-right: none; border-bottom: none; }
  .widget::after  { bottom: 12px; right: 12px; border-left: none; border-top: none; }

  /* ---- greeting, top-left ---- */
  .greeting { position: relative; display: flex; flex-direction: column; gap: 6px; }
  .greeting .hi {
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .greeting .name {
    font-family: "Doto", monospace;
    font-weight: 800;
    font-size: 30px;
    letter-spacing: 0.04em;
    line-height: 1;
    color: var(--ink);
  }

  /* ---- time, bottom-left ---- */
  .time {
    position: relative;
    font-family: "Doto", monospace;
    font-weight: 800;
    font-size: 66px;
    line-height: 0.9;
    letter-spacing: 0.03em;
    display: flex;
    align-items: flex-end;
  }
  .time .sep { color: var(--accent); padding: 0 4px; }
  .time .secs {
    font-size: 20px;
    color: var(--dim);
    margin-left: 8px;
    padding-bottom: 8px;
    letter-spacing: 0.06em;
  }

  .hint {
    color: var(--dim);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .hint .accent { color: var(--accent); }
</style>
</head>
<body>
  <div class="stage">
    <div class="meta">Lifegrid&nbsp;· Nothing clock · <b>4&times;4</b></div>

    <div class="widget" id="widget">
      <div class="greeting">
        <span class="hi">Welcome</span>
        <span class="name" id="name">Advaith</span>
      </div>

      <div class="time" aria-label="current time">
        <span id="hh">00</span><span class="sep">:</span><span id="mm">00</span><span class="secs" id="ss">00</span>
      </div>
    </div>

    <div class="hint">name from your <span class="accent">settings profile</span></div>
  </div>

<script>
  const hhEl = document.getElementById("hh");
  const mmEl = document.getElementById("mm");
  const ssEl = document.getElementById("ss");

  // In the Android widget this name is read from the saved profile first-name.
  const firstName = "Advaith";
  document.getElementById("name").textContent = firstName || "there";

  const pad = (n) => String(n).padStart(2, "0");

  function tick() {
    const d = new Date();
    hhEl.textContent = pad(d.getHours());
    mmEl.textContent = pad(d.getMinutes());
    ssEl.textContent = pad(d.getSeconds());
  }

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
